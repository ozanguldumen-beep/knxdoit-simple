<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KNXdoit v12 Panel Test</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#eef2f7; }
    header { padding:16px 24px; background:#111827; color:white; }
    main { display:flex; gap:20px; padding:20px; }
    .sidebar { width:260px; background:white; border-radius:12px; padding:16px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    button { width:100%; margin:6px 0; padding:10px; border:0; border-radius:8px; cursor:pointer; background:#2563eb; color:white; font-weight:600; }
    canvas { background:white; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .hint { color:#6b7280; font-size:13px; line-height:1.4; }
  </style>
</head>
<body>
  <header>
    <h2>KNXdoit v12 - Gerçek Pano Görünümü</h2>
  </header>

  <main>
    <section class="sidebar">
      <h3>Ürün Ekle</h3>
      <button data-device="knx_power_supply">KNX Power Supply</button>
      <button data-device="knx_ip_interface">KNX IP Interface</button>
      <button data-device="relay_actuator_8ch">8CH Röle Aktüatör</button>
      <button data-device="dimmer_4ch">4CH Dimmer</button>
      <button data-device="curtain_actuator_4ch">4CH Perde Aktüatör</button>
      <p class="hint">Cihazlar otomatik olarak DIN ray üzerine yerleşir. Ray dolarsa sonraki raya geçer.</p>
    </section>

    <canvas id="panelCanvas"></canvas>
  </main>

  <script type="module" src="./ui.js"></script>
</body>
</html>
