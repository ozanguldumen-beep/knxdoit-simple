<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>KNXdoit Simple</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1>KNX<span>doit</span></h1>
        <p>Kolay KNX kablo çizim ve grup adres aracı</p>

        <button onclick="addRoom()">+ Oda Ekle</button>
        <button onclick="addPanel()">+ Pano Ekle</button>

        <div class="section-title">Hatlar</div>
        <button onclick="setTool('energy')" id="btn-energy">Enerji Hattı 220V</button>
        <button onclick="setTool('knx')" id="btn-knx">KNX Bus Hattı</button>

        <div class="section-title">Araçlar</div>
        <button onclick="generateGA()">Grup Adresi Oluştur</button>
        <button onclick="clearSelection()">Seçimi Temizle</button>
        <button onclick="clearCanvas()">Projeyi Temizle</button>

        <div class="help">
            <b>Kullanım:</b><br>
            1. Oda ve pano ekle<br>
            2. Odaya çift tıkla, cihaz ekle<br>
            3. Enerji veya KNX seç<br>
            4. İki elemana tıkla, hat çiz
        </div>
    </aside>

    <main class="workspace">
        <header>
            <div>
                <h2>Villa Projesi</h2>
                <span id="status">Kaydedilmedi</span>
            </div>
            <button class="save" onclick="saveProject()">Projeyi Kaydet</button>
        </header>

        <div id="canvas" class="canvas">
            <svg id="wires"></svg>
        </div>
    </main>

    <aside class="rightbar">
        <h3>Grup Adresleri</h3>
        <div id="gaList" class="panel-list">Henüz oluşturulmadı.</div>

        <h3>Ürün Listesi</h3>
        <div id="bomList" class="panel-list">Henüz ürün yok.</div>
    </aside>
</div>

<script src="/static/app.js"></script>
</body>
</html>
