<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KNXdoit v12</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">KNX</div>
        <div>
          <h1>KNXdoit v12</h1>
          <p>Panel + çizim + ürün ekleme</p>
        </div>
      </div>

      <section class="menu-section">
        <button class="menu-title" data-toggle="knxProducts">▾ KNX Ürünler</button>
        <div id="knxProducts" class="menu-list"></div>
      </section>

      <section class="menu-section">
        <button class="menu-title" data-toggle="actuators">▾ Aktüatörler</button>
        <div id="actuators" class="menu-list"></div>
      </section>

      <section class="menu-section">
        <button class="menu-title" data-toggle="loads">▾ Yük / Cihazlar</button>
        <div id="loads" class="menu-list"></div>
      </section>

      <section class="actions">
        <button id="clearPanel" class="secondary-btn">Pano Temizle</button>
        <button id="downloadPdf" class="primary-btn">PDF Çıktı</button>
      </section>

      <section class="status-box">
        <h3>Durum</h3>
        <div id="statusText">Sistem hazır.</div>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <h2>Gerçek Pano Görünümü</h2>
          <p>DIN raylara ürün ekleyerek KNX pano yerleşimini oluştur.</p>
        </div>
      </header>

      <div class="canvas-wrap">
        <canvas id="panelCanvas"></canvas>
      </div>
    </main>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
