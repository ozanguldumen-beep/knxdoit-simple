<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KNXdoit v5</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="top">
<input id="projectName" value="Villa Projesi">
<button onclick="addFloor()">+ Kat</button>
<button onclick="addRoom()">+ Oda</button>
</div>

<div class="layout">
<div class="left">
<h3>KNX Ürünler</h3>
<button onclick="addDevice('switch')">KNX Anahtar</button>
<button onclick="addDevice('thermostat')">KNX Termostat</button>
<button onclick="addDevice('sensor')">KNX Sensör</button>

<h3>Aktüatörler</h3>
<button onclick="addDevice('actuator')">Switch Actuator</button>
<button onclick="addDevice('dimmer')">Dimmer Actuator</button>

<h3>Enerji</h3>
<button onclick="addDevice('lamp')">Lamba</button>
<button onclick="addDevice('blind')">Perde</button>
</div>

<div id="canvas" class="canvas"></div>

<div class="right">
<h3>Projeler</h3>
<button onclick="save()">Kaydet</button>
<button onclick="load()">Yükle</button>
</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
