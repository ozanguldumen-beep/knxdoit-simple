<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>KNXdoit</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div style="display:flex; height:100vh;">

    <div style="width:220px; background:#102033; color:white; padding:20px;">
        <h2>KNXdoit</h2>
        <button onclick="addRoom()">+ Oda</button><br><br>
        <button onclick="addPanel()">+ Pano</button><br><br>
        <button onclick="setTool('energy')">Enerji</button><br>
        <button onclick="setTool('knx')">KNX</button><br><br>
        <button onclick="generateGA()">GA</button>
    </div>

    <div id="canvas" style="flex:1; position:relative; background:#f5f5f5;">
        <svg id="wires" style="position:absolute; width:100%; height:100%"></svg>
    </div>

    <div style="width:300px; padding:10px;">
        <h3>Grup Adresleri</h3>
        <div id="gaList"></div>
    </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
