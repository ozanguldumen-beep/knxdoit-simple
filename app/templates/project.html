{% extends "base.html" %}
{% block title %}Yeni Proje{% endblock %}
{% block content %}
<div id="app" data-project-name="{{ project_name }}">
  <aside class="sidebar">
    <div class="section-title">Kat / Oda</div>
    <button id="addFloorBtn" class="soft-btn">+ Kat Ekle</button>
    <div id="floorTabs" class="floor-tabs"></div>
    <button id="addRoomBtn" class="soft-btn">+ Oda Ekle</button>
    <button id="addCollectorBtn" class="soft-btn">+ Kollektör Ekle</button>

    <div class="section-title">Odaya Cihaz Ekle</div>
    <select id="roomSelect"></select>
    <div id="fieldDevices"></div>

    <div class="section-title">Pano Ürünleri</div>
    <div id="panelProducts"></div>

    <div class="actions-grid">
      <button id="clearBtn" class="soft-btn">Pano Temizle</button>
      <button id="saveBtn" class="soft-btn">Projeyi Kaydet</button>
      <button id="pdfBtn" class="btn">PDF Çıktı</button>
      <button id="knxBtn" class="btn green">.knxproj</button>
    </div>

    <div class="status-box">
      <h3>Durum</h3>
      <div id="statusText">Sistem hazır.</div>
      <div id="rulesText" class="rules-text"></div>
    </div>
  </aside>

  <main class="workspace">
    <header class="work-head">
      <div><h1>KNXdoit v16</h1><p>Kat, oda, kollektör, pano ve KNX çıktı motoru.</p></div>
      <div class="summary"><span>Oda: <b id="roomCount">0</b></span><span>Ürün: <b id="productCount">0</b></span><span>GA: <b id="gaCount">0</b></span></div>
      <div class="zoom-box"><button id="zoomOut">-</button><input id="zoomRange" type="range" min="50" max="150" value="100"><button id="zoomIn">+</button><button id="zoomReset">100%</button></div>
      <select id="etsSelect"><option>ETS6</option><option>ETS5</option></select>
    </header>
    <div class="canvas-scroll"><div id="canvasStage"><canvas id="mainCanvas"></canvas></div></div>
  </main>

  <aside class="rightbar">
    <h2>Grup Adresleri</h2>
    <div id="gaList"></div>
  </aside>
</div>
<script type="module" src="/static/app.js"></script>
{% endblock %}
