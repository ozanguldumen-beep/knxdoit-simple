{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Giriş Yap</h2>
  <form method="POST">
    <label>Email</label><input type="email" name="email" required>
    <label>Şifre</label><input type="password" name="password" required>
    <button class="btn" type="submit">Giriş Yap</button>
  </form>
  <p>Hesabın yok mu? <a href="/register">Ücretsiz dene</a></p>
</div>
{% endblock %}
